# Shared catalog for the three-module template (:core holds the
# manager/API layer, :ui the views, :app the composition root), so
# every module's dependencies are declared here.
# Tested ceiling for Kotlin 2.4.10: Gradle 9.5.0, AGP 9.1.0.
[versions]
androidx-test-runner = "1.6.2"
agp = "9.0.1"
kotlin = "2.4.10"
# Hilt 2.60.1 is the minimum safe version on AGP 9 (2.59 and 2.60 have
# known regressions).
ksp = "2.3.10"
hilt = "2.60.1"
android-compileSdk = "36"
android-minSdk = "32"
android-targetSdk = "36"
composeBom = "2026.06.01"
# Newer androidx.* releases may require compileSdk 37 + AGP 9.1; keep added
# libraries within what the pinned compileSdk/AGP support.
androidx-activity = "1.13.0"
# material-icons was frozen at 1.7.x and dropped from the Compose BOM.
materialIcons = "1.7.8"
# Explicit (not transitive): FileProvider backs the log-export share.
androidx-core = "1.16.0"
# datastore 1.3.x is alpha; 1.2.1 is the current stable.
datastore = "1.2.1"
kotlinx-coroutines = "1.11.0"
kotlinx-datetime = "0.7.1"
kotlinx-serialization = "1.11.0"
ktor = "3.5.1"
# Floor set by datastore-preferences-core; used directly for log file IO.
okio = "3.9.1"
# JVM unit-test stack (core, ui, and app src/test), matching the
# JUnit4 style of the instrumented tests.
junit = "4.13.2"

[libraries]
compose-uiTestJunit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-uiTestManifest = { module = "androidx.compose.ui:ui-test-manifest" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
# Versions of androidx.compose.* artifacts come from the BOM.
compose-ui = { module = "androidx.compose.ui:ui" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-uiToolingPreview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-uiTooling = { module = "androidx.compose.ui:ui-tooling" }
compose-materialIconsCore = { module = "androidx.compose.material:material-icons-core", version.ref = "materialIcons" }
# Not covered by the Compose BOM; pinned explicitly.
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-core = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
# The -core artifacts are pure Kotlin/JVM (KMP), which is what lets
# the managers live in the :core module with no Android classpath.
androidx-datastore-core = { module = "androidx.datastore:datastore-core", version.ref = "datastore" }
androidx-datastore-preferences-core = { module = "androidx.datastore:datastore-preferences-core", version.ref = "datastore" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinx-datetime" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-contentNegotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinxJson = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
okio = { module = "com.squareup.okio:okio", version.ref = "okio" }
junit = { module = "junit:junit", version.ref = "junit" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
# MockEngine backing AppConfig.httpClientFactory in JVM unit tests.
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-compiler", version.ref = "hilt" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidLibrary = { id = "com.android.library", version.ref = "agp" }
kotlinJvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
