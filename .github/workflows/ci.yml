# The CI gate: the same tasks the README documents for local runs,
# executed on every push and pull request. Every module builds and
# tests here, including :templates (nothing depends on it, so module-
# scoped app builds skip it; this gate is what keeps the exemplars
# compiling and green), plus the R8 release build and lint.
name: CI

on: [push, pull_request]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle (with build caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Build, test, and lint every module
        run: >
          ./gradlew
          :app:assembleDebug
          :app:assembleRelease
          :core:test
          :ui:testDebugUnitTest
          :app:testDebugUnitTest
          :templates:testDebugUnitTest
          :app:compileDebugAndroidTestKotlin
          :templates:compileDebugAndroidTestKotlin
          :app:lintDebug

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            **/build/reports/tests/**
            **/build/reports/lint-results-*.html
